# First perception model: pavement / not pavement / kart at 640 x 400 with a
# MobileNetV3 LR-ASPP head (torchvision, ImageNet backbone). Small enough to
# train on one workstation GPU in an evening and to run well above 20 fps on
# the Orin in FP16. Swap model.name for another entry in models.py to compare.
model:
  name: lraspp_mobilenet_v3_large
  pretrained_backbone: true
input: {width: 640, height: 400}
epochs: 40
batch_size: 16
lr: 0.001
weight_decay: 0.0001
workers: 4
amp: true
loss:
  class_weights: [1.0, 1.0, 2.0]    # background, pavement, kart
sampling:
  tier_weighted: true               # draw frames by the tier weight in the split file
augment:
  hflip: 0.5
  scale: [0.8, 1.25]
  vshift: 0.08                      # fraction of height: horizon randomization for helmet footage
  hshift: 0.05
  brightness: 0.3
  contrast: 0.3
  saturation: 0.3
  blur: 0.15
  grayscale: 0.05
select: pavement_iou                # checkpoint selection metric on val
eval:
  camera: configs/camera_default.yaml
  gates:                            # docs/08-training-data.md section 7, on held-out tier A
    pavement_iou: 0.95
    boundary_error_15m: 0.3

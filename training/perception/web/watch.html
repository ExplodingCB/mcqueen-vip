<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training watch</title>
<style>
:root{--bg:#f6f6f3;--panel:#fff;--ink:#1c1d1f;--mute:#6b6f76;--line:#e2e2dc;--grid:#ececE6;--c0:#2a6fdb;--c1:#d9531e;--c2:#1f9d6b;--c3:#8a4fd0;--good:#1f9d6b;--warn:#c98a00;--bad:#c2372b}
@media (prefers-color-scheme:dark){:root{--bg:#141517;--panel:#1c1e21;--ink:#ececea;--mute:#9a9ea6;--line:#2c2f34;--grid:#25282c;--c0:#6ea2ff;--c1:#ff8a5c;--c2:#4cd39b;--c3:#b98cf0;--good:#4cd39b;--warn:#e3b341;--bad:#ff7b6e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;margin-bottom:14px}
h1{font-size:20px;margin:0}
.sub{color:var(--mute);font-size:12px}
.runs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px 4px 9px;cursor:pointer;user-select:none;font-size:13px}
.chip.off{opacity:.45}
.dot{width:10px;height:10px;border-radius:50%}
.state{font-size:11px;color:var(--mute)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.card b{display:block;font-size:22px;font-variant-numeric:tabular-nums;font-weight:600}
.card span{color:var(--mute);font-size:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.panel h2{font-size:14px;margin:0 0 2px}
.panel p{margin:0 0 8px;color:var(--mute);font-size:12px}
.tools{float:right;font-size:12px;color:var(--mute)}
.tools label{cursor:pointer}
canvas{width:100%;height:300px;display:block}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
th,td{text-align:right;padding:4px 8px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:500}
#tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.15);display:none;font-variant-numeric:tabular-nums}
.empty{color:var(--mute);padding:40px 0;text-align:center}
</style>
</head>
<body>
<main>
<header><h1>Training watch</h1><div class="sub" id="stamp">connecting…</div></header>
<div class="runs" id="runs"></div>
<div class="cards" id="cards"></div>
<section class="panel">
<span class="tools"><label><input type="checkbox" id="log" checked> log scale</label></span>
<h2>Training loss</h2><p>BCE plus Dice. Faint line: every 10 steps. Dots: epoch mean.</p>
<canvas id="loss"></canvas>
</section>
<section class="panel">
<h2>Validation IoU</h2><p>Pavement IoU on tracks the model never trains on, one point per epoch. Dashed line: the 0.95 target from docs/08 section 7 (held-out real footage, not this).</p>
<canvas id="iou"></canvas>
</section>
<section class="panel"><h2>Epochs</h2><p id="tablenote"></p><table id="table"></table></section>
</main>
<div id="tip"></div>
<script>
const COLORS=['--c0','--c1','--c2','--c3'];
let runs=[],hidden=new Set(),hover=null;
const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmtT=s=>s==null?'–':s<90?Math.round(s)+' s':(s/60).toFixed(1)+' min';
const colorOf=i=>css(COLORS[i%COLORS.length]);

async function poll(){
  try{
    runs=await (await fetch('/api/runs',{cache:'no-store'})).json();
    $('stamp').textContent='updated '+new Date().toLocaleTimeString();
  }catch(e){$('stamp').textContent='server not reachable';}
  render();
}
function render(){
  const chips=$('runs');chips.innerHTML='';
  runs.forEach((r,i)=>{
    const c=document.createElement('div');c.className='chip'+(hidden.has(r.name)?' off':'');
    c.innerHTML=`<span class="dot" style="background:${colorOf(i)}"></span>${r.name}<span class="state">${r.status}</span>`;
    c.onclick=()=>{hidden.has(r.name)?hidden.delete(r.name):hidden.add(r.name);render();};
    chips.append(c);
  });
  const shown=runs.filter(r=>!hidden.has(r.name));
  cards(shown.length?shown[shown.length-1]:null);
  chart($('loss'),shown,'loss');chart($('iou'),shown,'iou');table(shown);
}
function cards(r){
  const el=$('cards');
  if(!r){el.innerHTML='<div class="empty">No runs yet. Start one with train.py.</div>';return}
  const e=r.epochs,last=e[e.length-1],steps=r.steps,lastStep=steps[steps.length-1];
  const best=e.length?Math.max(...e.map(x=>x.val_iou)):null;
  const loss=lastStep?lastStep.loss:last?last.train_loss:null;
  const items=[
    [r.status,'run '+r.name],
    [e.length+' / '+(r.total_epochs??'?'),'epochs done'],
    [loss==null?'–':loss.toFixed(4),'latest training loss'],
    [last?last.val_iou.toFixed(4):'–','latest validation IoU'],
    [best==null?'–':best.toFixed(4),'best validation IoU'],
    [r.status==='running'?fmtT(r.eta_s):fmtT(last?.t),r.status==='running'?'estimated time left':'training time']
  ];
  el.innerHTML=items.map(([b,s])=>`<div class="card"><b>${b}</b><span>${s}</span></div>`).join('');
}
function table(shown){
  const r=shown[shown.length-1];
  if(!r){$('table').innerHTML='';return}
  $('tablenote').textContent=r.name+(r.parameters?' · '+(r.parameters/1e6).toFixed(2)+' M parameters · '+r.device:'');
  $('table').innerHTML='<tr><th>Epoch</th><th>Train loss</th><th>Val IoU</th><th>Elapsed</th></tr>'+
    r.epochs.slice().reverse().map(e=>`<tr><td>${e.epoch}</td><td>${e.train_loss.toFixed(4)}</td><td>${e.val_iou.toFixed(4)}</td><td>${fmtT(e.t)}</td></tr>`).join('');
}
function series(r,kind){
  if(kind==='loss'){
    const raw=r.steps.map(s=>({x:s.step,y:s.loss}));
    const ep=r.epochs.map(e=>({x:e.step??e.epoch,y:e.train_loss,epoch:e.epoch}));
    return {raw,pts:ep,xEpoch:r.epochs.length&&r.epochs[0].step==null};
  }
  return {raw:[],pts:r.epochs.map(e=>({x:e.step??e.epoch,y:e.val_iou,epoch:e.epoch}))};
}
function chart(canvas,shown,kind){
  const dpr=devicePixelRatio||1,rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
  const g=canvas.getContext('2d');g.scale(dpr,dpr);
  const W=rect.width,H=rect.height,L=52,R=12,T=8,B=40;
  g.clearRect(0,0,W,H);
  const all=shown.map((r,i)=>({r,i,s:series(r,kind)}));
  const pts=all.flatMap(a=>[...a.s.raw,...a.s.pts]);
  if(!pts.length){g.fillStyle=css('--mute');g.font='13px system-ui';g.fillText('waiting for data…',L+10,H/2);return}
  // x is epochs when a run only has the log; otherwise steps. Normalise per run to epochs.
  const xs=a=>{const per=a.r.args?.tracks?Math.floor(a.r.args.tracks*a.r.args.frames/a.r.args.batch):null;
    return p=>a.s.xEpoch||!per?p.x:p.x/per;};
  let xmax=0,ymin=Infinity,ymax=-Infinity;
  const log=kind==='loss'&&$('log').checked;
  const ty=v=>log?Math.log10(Math.max(v,1e-4)):v;
  all.forEach(a=>{const f=xs(a);[...a.s.raw,...a.s.pts].forEach(p=>{xmax=Math.max(xmax,f(p));ymin=Math.min(ymin,ty(p.y));ymax=Math.max(ymax,ty(p.y));});});
  if(kind==='iou'){ymin=Math.min(ymin,0.9);ymax=Math.max(ymax,0.96);}
  const pad=(ymax-ymin)*0.08||0.05;ymin-=pad;ymax+=pad;
  xmax=Math.max(xmax,1);
  const X=v=>L+v/xmax*(W-L-R),Y=v=>T+(1-(ty(v)-ymin)/(ymax-ymin))*(H-T-B);
  g.font='11px system-ui';g.textBaseline='middle';
  // grid
  const ticks=5;
  for(let k=0;k<=ticks;k++){
    const v=ymin+(ymax-ymin)*k/ticks,py=T+(1-k/ticks)*(H-T-B);
    g.strokeStyle=css('--grid');g.beginPath();g.moveTo(L,py);g.lineTo(W-R,py);g.stroke();
    g.fillStyle=css('--mute');g.textAlign='right';
    g.fillText(log?Math.pow(10,v).toFixed(3):v.toFixed(3),L-6,py);
  }
  g.textAlign='center';g.textBaseline='top';
  const xt=Math.min(Math.ceil(xmax),12);
  for(let k=0;k<=xt;k++){const v=xmax*k/xt;g.fillStyle=css('--mute');g.fillText(v.toFixed(v%1?1:0),X(v),H-B+7);}
  g.fillStyle=css('--mute');g.fillText('epoch',(L+W-R)/2,H-16);
  if(kind==='iou'&&0.95>=ymin&&0.95<=ymax){
    g.setLineDash([5,4]);g.strokeStyle=css('--mute');g.beginPath();g.moveTo(L,Y(0.95));g.lineTo(W-R,Y(0.95));g.stroke();g.setLineDash([]);
  }
  const hits=[];
  all.forEach(a=>{
    const f=xs(a),col=colorOf(a.i);
    if(a.s.raw.length){
      g.strokeStyle=col;g.globalAlpha=.28;g.lineWidth=1;g.beginPath();
      a.s.raw.forEach((p,k)=>k?g.lineTo(X(f(p)),Y(p.y)):g.moveTo(X(f(p)),Y(p.y)));g.stroke();g.globalAlpha=1;
    }
    g.strokeStyle=col;g.lineWidth=2;g.beginPath();
    a.s.pts.forEach((p,k)=>k?g.lineTo(X(f(p)),Y(p.y)):g.moveTo(X(f(p)),Y(p.y)));g.stroke();
    g.fillStyle=col;
    a.s.pts.forEach(p=>{g.beginPath();g.arc(X(f(p)),Y(p.y),3.5,0,7);g.fill();hits.push({px:X(f(p)),py:Y(p.y),p,name:a.r.name,col});});
  });
  canvas._hits=hits;
  if(hover&&hover.canvas===canvas){
    const h=hover.hit;g.strokeStyle=h.col;g.lineWidth=2;g.beginPath();g.arc(h.px,h.py,6.5,0,7);g.stroke();
  }
}
for(const id of ['loss','iou']){
  const c=$(id);
  c.addEventListener('mousemove',e=>{
    const r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    let best=null,d=1e9;(c._hits||[]).forEach(h=>{const dd=Math.hypot(h.px-x,h.py-y);if(dd<d){d=dd;best=h}});
    const tip=$('tip');
    if(best&&d<28){
      hover={canvas:c,hit:best};
      tip.style.display='block';tip.style.left=e.clientX+14+'px';tip.style.top=e.clientY+14+'px';
      tip.innerHTML=`<b>${best.name}</b> · epoch ${best.p.epoch}<br>${id==='loss'?'train loss':'val IoU'} ${best.p.y.toFixed(4)}`;
    }else{hover=null;tip.style.display='none';}
    render();
  });
  c.addEventListener('mouseleave',()=>{hover=null;$('tip').style.display='none';render();});
}
$('log').onchange=render;
addEventListener('resize',render);
poll();setInterval(poll,3000);
</script>
</body>
</html>

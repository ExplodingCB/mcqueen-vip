# Every tunable of the simulator, planner and controllers. Units are SI, angles
# in radians. Kart numbers are placeholders until the drive-by-wire phase
# measures them; see docs/03-hardware.md section 1.
vehicle:
  wheelbase: 1.05          # m
  understeer: 0.002        # s^2/m, extra steer per m/s^2 lateral accel
  steer_max: 0.45          # rad at the front wheels
  steer_rate_max: 3.14     # rad/s
  steer_tau: 0.08          # s, first-order lag of the steering actuator
  accel_max: 3.0           # m/s^2 at full throttle and low speed
  v_max: 12.0              # m/s, speed where full throttle produces no acceleration
  brake_decel_max: 6.0     # m/s^2 at full brake
  rolling_decel: 0.3       # m/s^2 with both pedals released
  drag: 0.004              # 1/m, decel = drag * v^2
  gnss_noise: 0.02         # m, 1 sigma of the pose the harness feeds its controller

# What the sensors report, as opposed to what is true (mcq_sim/sensors.py). The
# state estimator consumes these and is scored against the truth the simulator
# keeps on /ego_truth.
sensors:
  gnss:
    rate_hz: 20.0
    latency: 0.08            # s between the fix being valid and the Jetson having it
    sigma_fixed: 0.02        # m, 1 sigma horizontal, RTK fixed
    sigma_float: 0.45        # m, RTK float
    sigma_none: 25.0         # m, no fix: the position carries no information
    vel_sigma_fixed: 0.03    # m/s per axis
    vel_sigma_float: 0.20
    vel_sigma_none: 5.0
    # Piecewise-constant fix status, [[t_seconds, NONE|FLOAT|FIXED], ...],
    # applied from each time onward. Scripted so a run is reproducible.
    schedule: [[0.0, FIXED]]

  imu:
    rate_hz: 200.0
    accel_sigma: 0.05        # m/s^2 per axis
    gyro_sigma: 0.002        # rad/s per axis
    accel_bias_walk: 0.01    # m/s^2 per root second
    gyro_bias_walk: 0.0005   # rad/s per root second
    accel_bias0: 0.05        # m/s^2, 1 sigma of the power-on bias
    gyro_bias0: 0.005        # rad/s
    gravity: 9.80665

  wheel:
    sigma: 0.05              # m/s per wheel
    resolution: 0.05         # m/s, hall measurement quantization until Phase 1 measures it
    rear_slip: 0.04          # fraction of speed added to the rears at full throttle

  steering:
    sigma: 0.002             # rad
    bits: 14                 # absolute column encoder resolution
    bias: 0.0                # rad, mounting offset

planner:
  horizon_s: 2.5
  dt: 0.05
  n_lateral: 9             # lateral offset candidates per cycle
  kart_half_width: 0.7     # m, half of the widest point of the kart
  margin: 0.2              # m, extra distance kept from each edge
  w_ref: 0.5               # cost weight on squared deviation from the reference
  w_jerk: 2.0              # cost weight on curvature change along the path
  a_lat_max: 3.0
  a_long_max: 2.0
  a_brake_max: 3.0
  v_cap: 5.0               # m/s, FOLLOW mode
  v_min: 0.5
  boundary_v_cap: 4.0      # m/s, BOUNDARY mode
  boundary_range: 25.0     # m of perceived edges used ahead of the kart
  min_path_length: 6.0     # m, horizon floor at low speed

lateral:
  k_v: 0.5                 # s, pure pursuit lookahead per m/s
  l_min: 1.5               # m
  l_max: 6.0               # m
  a_lat_max: 4.0           # software curvature limit
  jerk_lat_max: 6.0
  steer_rate_max: 2.5      # rad/s, software rate limit (looser than the gateway)

longitudinal:
  k_p: 0.8                 # accel per m/s of speed error
  k_i: 0.2
  k_f: 1.0
  accel_max: 2.5
  decel_max: -4.0
  stopping_speed: 0.5
  stopping_decel: -1.5
  throttle_per_accel: 0.33
  brake_per_decel: 0.17
  deadband: 0.05

safety:
  geofence_margin: 0.5     # m outside the edges before an urgent stop
  trajectory_max_age: 0.2  # s

harness:
  dt: 0.01                 # simulation and control period
  planner_period: 0.05
  laps: 3
  timeout_s: 600

foxglove_bridge:
  ros__parameters:
    address: 0.0.0.0
    port: 8765
    topic_whitelist:
      - '^/(telemetry/(summary|pose|trail|track)|ego_state|trajectory|gateway_status|planner_status|vehicle_command|vehicle_state|geofence_state)$'
    # Do not allow automatic QoS selection to introduce a reliable reader.
    best_effort_qos_topic_whitelist: ['.*']
    min_qos_depth: 1
    max_qos_depth: 1
    # Observation only; the dashboard is not a vehicle command interface.
    capabilities: ['connectionGraph']

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Everything that runs without ROS: the gateway firmware core, the C control
  # core, the DBC, the simulator and the training tooling.
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pyyaml pytest cantools ruff python-can mcap mcap-ros2-support
          pip install -r training/data/requirements.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: clang-format
        run: |
          sudo apt-get install -y clang-format
          clang-format --dry-run -Werror firmware/gateway/src/*.c firmware/gateway/include/gateway/*.h \
            firmware/gateway/test/*.c src/mcq_control/core/src/*.c src/mcq_control/core/include/mcq/*.h \
            src/mcq_control/core/test/*.c src/mcq_track/core/src/*.cpp \
            src/mcq_track/core/include/mcq_track/*.hpp src/mcq_track/core/test/*.cpp src/mcq_track/src/*.cpp
      - name: CAN vectors and generated code are in sync with the DBC
        run: |
          python firmware/gateway/tools/gen_can_vectors.py --check
          python src/mcq_vehicle/tools/gen_can_code.py --check
      - name: Gateway firmware host tests
        run: |
          cmake -S firmware/gateway -B firmware/gateway/build -DCMAKE_BUILD_TYPE=Debug
          cmake --build firmware/gateway/build
          ctest --test-dir firmware/gateway/build --output-on-failure
      - name: Control core host tests
        run: |
          cmake -S src/mcq_control/core -B src/mcq_control/core/build -DCMAKE_BUILD_TYPE=Release
          cmake --build src/mcq_control/core/build
          ctest --test-dir src/mcq_control/core/build --output-on-failure
      - name: Track core host tests
        run: |
          cmake -S src/mcq_track/core -B src/mcq_track/core/build -DCMAKE_BUILD_TYPE=Release
          cmake --build src/mcq_track/core/build
          ctest --test-dir src/mcq_track/core/build --output-on-failure
      - name: Virtual CAN interface for the gateway host simulator
        run: |
          if sudo modprobe vcan && sudo ip link add dev vcan0 type vcan && sudo ip link set up vcan0; then
            echo "vcan0 is up"
          else
            echo "::warning::vcan unavailable on this runner; the gateway_host bus test will be skipped"
          fi
      - name: Python tests (simulator, DBC, survey, gateway over vcan, training tooling)
        run: python -m pytest -q -rs
      - name: Phase 0 loop on the synthetic oval
        run: |
          PYTHONPATH=src/mcq_sim python -m mcq_sim run --track tracks/synthetic_oval --laps 2
          PYTHONPATH=src/mcq_sim python -m mcq_sim run --track tracks/synthetic_oval --laps 1 --mode BOUNDARY

  # The ROS 2 packages build in the Jazzy container, the control core tests run
  # under colcon test, and the Phase 0 graph (simulator, planner, controller)
  # drives the synthetic oval.
  ros2:
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base
      # Fast DDS uses shared memory between processes on one host; Docker's
      # default 64 MB /dev/shm is not enough once the recorder subscribes to
      # every topic and latencies climb into the hundreds of milliseconds.
      options: --shm-size=1g
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake python3-numpy python3-scipy python3-yaml python3-pytest
          rosdep update --rosdistro jazzy
          rosdep install --from-paths src --ignore-src -y --rosdistro jazzy
      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_direct+ --cmake-args -DCMAKE_BUILD_TYPE=Release
      - name: Test
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --packages-select mcq_control mcq_track --event-handlers console_direct+
          colcon test-result --verbose
          ros2 interface show mcq_msgs/msg/VehicleCommand
      - name: Graph smoke test with recording (cold start)
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          RECORD=true BAG=/tmp/phase0_bag src/mcq_bringup/test/graph_smoke.sh record_cold
      - name: Graph smoke test, control run without recording
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          src/mcq_bringup/test/graph_smoke.sh control
      - name: Shifted track geofence and covariance gate in the driving graph
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          src/mcq_bringup/test/geofence_graph.sh shift
          sleep 3
          src/mcq_bringup/test/geofence_graph.sh covariance
          sleep 3
          src/mcq_bringup/test/geofence_graph.sh missing
      - name: Session was recorded to MCAP
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          ls /tmp/phase0_bag
          ros2 bag info /tmp/phase0_bag | tee bag_info.txt
          grep -q "Storage id:.*mcap" bag_info.txt
          grep -q "/ego_state" bag_info.txt
          grep -q "/vehicle_command" bag_info.txt
          grep -q "/trajectory" bag_info.txt
